name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: objektakte
          POSTGRES_PASSWORD: objektakte
          POSTGRES_DB: objektakte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U objektakte"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://objektakte:objektakte@localhost:5432/objektakte_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrationen sind aktuell
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Schema und Migrationen weichen ab: pnpm db:generate ausführen" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status --porcelain -- drizzle && echo "Nicht eingecheckte Migration erzeugt" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: E-Rechnungs-Validator starten (Mustang)
        run: |
          curl -fsSL -o /tmp/mustang.jar https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/2.26.0/Mustang-CLI-2.26.0.jar
          (PORT=8089 java -cp /tmp/mustang.jar validator/Server.java > /tmp/validator.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8089/health && exit 0; sleep 2; done
          cat /tmp/validator.log; exit 1
      - name: OpenAPI-Typen der Web-App sind aktuell
        run: |
          pnpm api:types
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts || (echo "API-Typen veraltet: pnpm api:types ausführen" && exit 1)
      # pnpm typecheck enthält svelte-check, pnpm test die Unit-Tests der Web-App.
      - run: pnpm test
        env:
          EINVOICE_VALIDATOR_URL: http://localhost:8089
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: objektakte
          POSTGRES_PASSWORD: objektakte
          POSTGRES_DB: objektakte_web
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U objektakte"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://objektakte:objektakte@localhost:5432/objektakte_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Browser installieren
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: E-Rechnungs-Validator starten (Mustang)
        run: |
          curl -fsSL -o /tmp/mustang.jar https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/2.26.0/Mustang-CLI-2.26.0.jar
          (PORT=8089 java -cp /tmp/mustang.jar validator/Server.java > /tmp/validator.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8089/health && exit 0; sleep 2; done
          cat /tmp/validator.log; exit 1
      - name: E2E-Tests
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          # Festgeschriebene Rechnungen werden in den E2E-Tests echt validiert.
          EINVOICE_VALIDATOR_URL: http://localhost:8089
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t objektakte-api .
      - run: docker build -t objektakte-validator validator
      - run: docker build -f apps/web/Dockerfile -t objektakte-web .
      - name: Images starten (Smoke-Test)
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=objektakte -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=objektakte postgres:16
          docker run -d --name validator --network smoke objektakte-validator
          until docker exec db pg_isready -U objektakte; do sleep 1; done
          docker run -d --name api --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://objektakte:smoke@db:5432/objektakte -e API_TOKEN=smoke-token \
            -e EINVOICE_VALIDATOR_URL=http://validator:8080 -e WHISPER_URL= -e NEXTCLOUD_URL= objektakte-api
          docker run -d --name web --network smoke -p 3001:3000 \
            -e API_URL=http://api:3000 -e API_TOKEN=smoke-token -e WEB_PASSWORD=smoke \
            -e WEB_SESSION_SECRET=0123456789abcdef0123456789abcdef -e ORIGIN=http://localhost:3001 objektakte-web
          for c in api web validator; do
            for i in $(seq 1 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] && break
              [ "$(docker inspect -f '{{.State.Running}}' $c)" = true ] || { docker logs $c; exit 1; }
              sleep 2
            done
            [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] || { docker logs $c; exit 1; }
            echo "$c healthy"
          done
          curl -fsS -H 'Authorization: Bearer smoke-token' http://localhost:3000/api/v1/cases > /dev/null
