name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: objektakte
          POSTGRES_PASSWORD: objektakte
          POSTGRES_DB: objektakte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U objektakte"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://objektakte:objektakte@localhost:5432/objektakte_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrationen sind aktuell
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Schema und Migrationen weichen ab: pnpm db:generate ausführen" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status --porcelain -- drizzle && echo "Nicht eingecheckte Migration erzeugt" && exit 1)
      - name: OpenAPI-Typen der Web-App sind aktuell
        run: |
          pnpm api:types
          git diff --exit-code -- apps/web/src/lib/api/schema.d.ts || (echo "API-Typen veraltet: pnpm api:types ausführen" && exit 1)
      # pnpm typecheck enthält svelte-check, pnpm test die Unit-Tests der Web-App.
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: objektakte
          POSTGRES_PASSWORD: objektakte
          POSTGRES_DB: objektakte_web
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U objektakte"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://objektakte:objektakte@localhost:5432/objektakte_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright-Browser installieren
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests
        working-directory: apps/web
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t objektakte-api .
      - run: docker build -f apps/web/Dockerfile -t objektakte-web .
